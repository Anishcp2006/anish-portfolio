<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e14"/>
      <stop offset="50%" stop-color="#0d151e"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="rc-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d26a"/>
    </linearGradient>
    <linearGradient id="rc-cobalt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="seat-occ" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="seat-vac" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow-em" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#rc-bg)"/>
  <!-- Modern Geometric Grid Lines -->
  <g opacity="0.07" stroke="#00f5a0" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  
  <!-- Dashboard Frame -->
  <rect x="45" y="35" width="710" height="430" rx="18" fill="#0e141c" stroke="#1f2a37" stroke-width="2"/>
  <rect x="45" y="35" width="710" height="50" rx="18" fill="#141d27"/>
  
  <!-- Window dots -->
  <circle cx="75" cy="60" r="6" fill="#f43f5e"/>
  <circle cx="95" cy="60" r="6" fill="#fbbf24"/>
  <circle cx="115" cy="60" r="6" fill="#00f5a0" filter="url(#glow-em)"/>
  
  <text x="400" y="66" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">RideCalm — ESP32 Smart Train Occupancy Telemetry</text>
  
  <!-- Live Status Badge -->
  <rect x="625" y="49" width="105" height="22" rx="11" fill="#064e3b" stroke="#00f5a0" stroke-width="1"/>
  <circle cx="638" cy="60" r="3.5" fill="#00f5a0" filter="url(#glow-em)"/>
  <text x="648" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f5a0" font-weight="700">ONLINE · 2.4G</text>

  <!-- Left: Coach Seat Layout -->
  <rect x="75" y="105" width="390" height="335" rx="14" fill="#090d13" stroke="#1e2a38" stroke-width="1"/>
  <text x="95" y="135" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Coach B4 Live Telemetry</text>
  <text x="340" y="135" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f5a0" font-weight="600">Occupancy: 62.5%</text>

  <!-- Seats Grid -->
  <!-- A1 -->
  <rect x="105" y="160" width="68" height="58" rx="10" fill="url(#seat-occ)" stroke="#fb7185" stroke-width="1"/>
  <text x="139" y="190" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">A1</text>
  <text x="139" y="206" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fecdd3" text-anchor="middle">68.4 kg</text>

  <!-- A2 -->
  <rect x="185" y="160" width="68" height="58" rx="10" fill="url(#seat-vac)" stroke="#00f5a0" stroke-width="1"/>
  <text x="219" y="190" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#052e16" text-anchor="middle">A2</text>
  <text x="219" y="206" font-family="'JetBrains Mono', monospace" font-size="9" fill="#064e3b" font-weight="700" text-anchor="middle">VACANT</text>

  <!-- A3 -->
  <rect x="285" y="160" width="68" height="58" rx="10" fill="url(#seat-occ)" stroke="#fb7185" stroke-width="1"/>
  <text x="319" y="190" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">A3</text>
  <text x="319" y="206" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fecdd3" text-anchor="middle">74.1 kg</text>

  <!-- A4 -->
  <rect x="365" y="160" width="68" height="58" rx="10" fill="url(#seat-occ)" stroke="#fb7185" stroke-width="1"/>
  <text x="399" y="190" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">A4</text>
  <text x="399" y="206" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fecdd3" text-anchor="middle">59.0 kg</text>

  <!-- B1 -->
  <rect x="105" y="235" width="68" height="58" rx="10" fill="url(#seat-vac)" stroke="#00f5a0" stroke-width="1"/>
  <text x="139" y="265" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#052e16" text-anchor="middle">B1</text>
  <text x="139" y="281" font-family="'JetBrains Mono', monospace" font-size="9" fill="#064e3b" font-weight="700" text-anchor="middle">VACANT</text>

  <!-- B2 -->
  <rect x="185" y="235" width="68" height="58" rx="10" fill="url(#seat-occ)" stroke="#fb7185" stroke-width="1"/>
  <text x="219" y="265" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">B2</text>
  <text x="219" y="281" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fecdd3" text-anchor="middle">81.2 kg</text>

  <!-- B3 -->
  <rect x="285" y="235" width="68" height="58" rx="10" fill="url(#seat-vac)" stroke="#00f5a0" stroke-width="1"/>
  <text x="319" y="265" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#052e16" text-anchor="middle">B3</text>
  <text x="319" y="281" font-family="'JetBrains Mono', monospace" font-size="9" fill="#064e3b" font-weight="700" text-anchor="middle">VACANT</text>

  <!-- B4 -->
  <rect x="365" y="235" width="68" height="58" rx="10" fill="url(#seat-occ)" stroke="#fb7185" stroke-width="1"/>
  <text x="399" y="265" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">B4</text>
  <text x="399" y="281" font-family="'JetBrains Mono', monospace" font-size="9" fill="#fecdd3" text-anchor="middle">63.5 kg</text>

  <!-- Lower Edge Metrics -->
  <rect x="105" y="315" width="330" height="105" rx="10" fill="#141d27" stroke="#1e2a38" stroke-width="1"/>
  <text x="120" y="340" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f5a0" font-weight="700">ESP32 Edge Hub #01 — FSR Sensor Array</text>
  <text x="120" y="365" font-family="'Poppins', sans-serif" font-size="11" fill="#94a3b8">Threshold: &gt;12.5 kg | Polling Rate: 50Hz | BLE Broadcast</text>
  <text x="120" y="390" font-family="'Poppins', sans-serif" font-size="11" fill="#00f5a0">● Status: Real-time telemetry synced to passenger UI</text>

  <!-- Right Panel -->
  <rect x="485" y="105" width="245" height="160" rx="14" fill="#090d13" stroke="#1e2a38" stroke-width="1"/>
  <text x="505" y="135" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Embedded Specs</text>
  
  <rect x="505" y="150" width="205" height="32" rx="6" fill="#141d27"/>
  <text x="515" y="171" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f5a0">ESP32 Xtensa Dual-Core</text>
  
  <rect x="505" y="190" width="205" height="32" rx="6" fill="#141d27"/>
  <text x="515" y="211" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">Wi-Fi 802.11n + BLE 4.2</text>

  <rect x="505" y="230" width="205" height="24" rx="6" fill="#064e3b"/>
  <text x="515" y="246" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f5a0" font-weight="700">Power: 3.3V Ultra Low Mode</text>

  <!-- Right Lower Box -->
  <rect x="485" y="280" width="245" height="160" rx="14" fill="#090d13" stroke="#1e2a38" stroke-width="1"/>
  <text x="505" y="310" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Telemetry Stream</text>
  <path d="M 505 370 Q 535 340, 565 365 T 625 350 T 710 360" fill="none" stroke="url(#rc-emerald)" stroke-width="3"/>
  <circle cx="710" cy="360" r="4" fill="#00f5a0" filter="url(#glow-em)"/>
  <text x="505" y="400" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Analog delta signal (mV)</text>
  <text x="505" y="422" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#00f5a0">Python Stream Processor</text>
</svg>